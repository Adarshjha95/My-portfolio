<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:flex;
            height: 100%;
            justify-content: center;
            align-items: center;
            background-color:#f3eae3;
            overflow: hidden;
        }
        #one{
            height: 400px;
            width: 270px;
            border:1px solid white;
            position: relative;
            top: 80px;
            background-color: #feffff;
            border-bottom-right-radius: 8px;
            border-top-right-radius: 8px;
        }
        img{
            position: relative;
            top: 80px;
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }
        p{
            padding: 20px;
            color: rgb(138, 137, 137);
        
        }
        h1{
            padding: 20px;
            position: relative;
            bottom: 58px;
        }
        #line{
            position: relative;
            bottom: 100px;
            color:  rgb(138, 137, 137);
        }
        #price{
            padding:20px;
            position: relative;
            bottom: 125px;
            font-size: 28px;
            font-weight: bold;
            color: #32866b;
        }
        #two{
            position: relative;
            bottom: 125px;
            padding: 15px;
            text-decoration: line-through;
        }
        button{
            position: relative;
            bottom: 100px;
            left: 20px;
            width: 230px;
            background-color: #438f73;
            color: white;
            border: none;
            padding: 20px;
            border-radius: 10px;
            font-size: 15px;
        }
        p{
            position: relative;
            bottom: 10px;
        }
    </style>
</head>
<body>
    <img src="perfume.png" height="401px" width="270px">
    <div id="one">
        <p>P E R F U M E</p>
        <h1>Gabrielle <br> Essence Eau <br> De Parfum</h1>
        <p id="line">A floral, solar and voluptuous <br> interpretation composed by <br> olivier polge, Perfumer-Creator <br> for the house of CHANEL</p>
        <span id="price"> $149.99</span>
        <span id="two">$169.99</span>
        <br>
        <button>🛒  Add to cart</button>
    </div>
</body>
</html>
